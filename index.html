<script>


//=========================================================|| 🍎(BEGIN) MRE Calculator Function/variables🍎 ||==========================================================================//

// MRE calculator variables
const soldierInput = document.getElementById('soldiers');
const perDayInput = document.getElementById('mres');
const daysInput = document.getElementById('days');
const finalResult = document.getElementById('result');
const calButton = document.getElementById('calculate_button');


// MRE Calculator Function.
//  Runs this block of code every time the calculate button is clicked.
calButton.addEventListener("click", function () {

// Reads the current value from each inpute, converts it from text to a number, and multiples them together.
// .value always returns text, even for number inputs, so Number() converts
// each one to an actual number before multiplying (otherwise * could misbehave
// or produce NaN on unexpected input)
const totalMRES = Number(soldierInput.value) * Number(perDayInput.value) * Number(daysInput.value);
const mreboxes = Math.ceil(totalMRES / 12);
const perSoldier = Number(perDayInput.value) * Number(daysInput.value);
const totalPerDay = Number(perDayInput.value) * Number(daysInput.value);


// Displays the result on the page by setting the text inside the result paragraph.
finalResult.innerHTML = "🍎Total MREs needed: " + totalMRES + "<br>" +
                        "🍎Total boxes needed: " + mreboxes + "<br>" +
                        "🍎MREs per soldier: " + perSoldier + "<br>" +
                        "🍎Total MREs consumed each day: " + totalPerDay;


})

//==========================================================|| 🍎(END) MRE Calculator Function/variables🍎 ||=========================================================================//

//==========================================================|| 💧(BEGIN) Water Calculator Function/variables💧 ||=========================================================================//

          //water  calculator variables
          const numberOfSoldiers = document.getElementById("soldiersgoing");
          const waterPer = document.getElementById("water");
          const daysGone = document.getElementById("waterdays");
          const calWater = document.getElementById("waterButton")
          const finalResultWater = document.getElementById("waterResult")
          
          
          calWater.addEventListener("click", function() {

          const totalQuarts = Number(numberOfSoldiers.value) * Number(waterPer.value) * Number(daysGone.value);
          const quartsPerSoldier = Number(waterPer.value) * Number(daysGone.value);
          const totalGallons = (totalQuarts / 4).toFixed(2);
          const cansNeeded = Math.ceil(Number(totalGallons) / 5);
          const buffaloesNeeded = Math.ceil(Number(totalGallons) / 400);

          finalResultWater.innerHTML = "💧Total water needed (Quarts): " + totalQuarts + "<br>" +
                                       "💧Quarts per soldier: " + quartsPerSoldier + "<br>" +
                                       "💧Total water needed (Gallons): " + totalGallons + "<br>" +
                                       "💧Water cans needed (5 gal each): " + cansNeeded + "<br>" +
                                       "💧Water buffaloes needed (400 gal each): " + buffaloesNeeded;

          })

          
//==========================================================|| 💧(END) Water Calculator Function/variables💧 ||=========================================================================//



// Meters to feet
const metersInput = document.getElementById("meters");
const metersButton = document.getElementById("metersButton");
const metersResult = document.getElementById("metersResult");

metersButton.addEventListener("click", function() {
  const feet = Number(metersInput.value) * 3.28084;
  metersResult.textContent = metersInput.value + " meters = " + feet.toFixed(2) + " feet";
});

// Kilometers to miles
const kmInput = document.getElementById("km");
const kmButton = document.getElementById("kmButton");
const kmResult = document.getElementById("kmResult");

kmButton.addEventListener("click", function() {
  const miles = Number(kmInput.value) * 0.621371;
  kmResult.textContent = kmInput.value + " km = " + miles.toFixed(2) + " miles";
});


//==========================================================|| 🔥(BEGIN) Rate of Fire Calculator Function/variables🔥 ||=========================================================================//


const roundsAvailable = document.getElementById("roundsAvailable");
const rapidMinutesWanted = document.getElementById("rapidMinutesWanted");
const suppressionButton = document.getElementById("240button");
const suppressionResult = document.getElementById("suppressionResult");

suppressionButton.addEventListener("click", function() {

  const totalRounds = Number(roundsAvailable.value);
  const rapidMinutes = Number(rapidMinutesWanted.value);

  const roundsUsedAtRapid = rapidMinutes * 200; // rapid rate = 200 rds/min

  if (roundsUsedAtRapid >= totalRounds) {
    suppressionResult.innerHTML = "⚠️ You don't have enough rounds for " + rapidMinutes + " minutes at rapid rate. You'd run dry at " + (totalRounds / 200).toFixed(1) + " minutes.";
    return;
  }

  const roundsRemaining = totalRounds - roundsUsedAtRapid;
  const sustainedMinutes = roundsRemaining / 100; // sustained rate = 100 rds/min
  const sustMin = Math.floor(sustainedMinutes);
  const sustSec = Math.round((sustainedMinutes - sustMin) * 60);

  suppressionResult.innerHTML =
                              "🔥 Rapid rate for " + rapidMinutes + " min uses " + roundsUsedAtRapid + " rounds<br>" +
                              "🔥 Rounds remaining: " + roundsRemaining + "<br>" +
                              "🔥 Remaining rounds at sustained rate will last: " + sustMin + " min " + sustSec + " sec";
});

//==========================================================|| 🔥(END) rate of Fire Calculator Function/variables🔥 ||=========================================================================//

//==========================================================|| (BEGIN) platoon admin tracker [array/function] ||=====================================================================================//


//The empty Array for platoon admin tracker//
const Array1_platoonAdminTracker = [];

//variabls linked to the div tag//
const Container_platoonAdminTracker = document.getElementById("platoonAdminTracker");
const Button_addToPlatoon = document.getElementById("addPlatoonMember");

//function that adds the inputs to the platton admin array//
function addToPlatoon_function () {
Array1_platoonAdminTracker.push(
  {dutyPosition_Array: "", rank_Array: "", lastName_Array: "", firstName_Array: ""}
);


const index_platoonAdminTracker = Array1_platoonAdminTracker.Length - 1;

//displays input information on the html page//
Container_platoonAdminTracker.insertAdjacentHTML("beforeend", `
     <div class="js_DivBox">
      <input type="text" id="dutyposition${index_platoonAdminTracker}" placeholder="SM Duty Position">
      <br>

      <input type="text" id="rank${index_platoonAdminTracker}" placeholder="Rank">
      <br>

      <input type="text" id="lastname${index_platoonAdminTracker}" placeholder="Last Name">
      <br>

      <input type="text" id="firstname${index_platoonAdminTracker}" placeholder="First Name">
      <br>
     </div>
 `);
}

addToPlatoon_function();
Button_addToPlatoon.addEventListener("click", addToPlatoon_function);

</script>
